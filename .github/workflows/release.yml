name: Release to PyPI

# Tag-triggered release. Push an annotated tag matching v* (e.g. v0.3.0) whose
# number equals `version` in pyproject.toml, and this builds the sdist + wheel
# and publishes them to PyPI via trusted publishing (OIDC) -- no API token is
# stored in the repo. Configure the publisher once on PyPI:
#   PyPI project "peakatail" -> Settings -> Publishing -> add a GitHub publisher
#   owner=BMGLab repo=PeakATail workflow=release.yml environment=pypi
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          echo "tag=$tag pyproject=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$proj'." >&2
            echo "::error::PyPI never lets a version number be reused, so publishing the wrong one is permanent. Fix the tag or the version and retry." >&2
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing needs an OIDC token; the environment gate lets the
    # PyPI publisher scope trust to this workflow + environment.
    environment:
      name: pypi
      url: https://pypi.org/project/peakatail/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Create the GitHub Release
    needs: [build, publish]
    # Only a real tag can be released; workflow_dispatch has no version to
    # release and would create a Release named after a branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Zenodo archives the repository and mints a DOI when a GitHub *Release* is
    # published -- a bare tag does not trigger it. This job is therefore what
    # turns `git push origin v0.3.0` into a citable DOI, and it runs after
    # `publish` so a release that failed to reach PyPI never gets archived.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          python scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PeakATail $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/*
