name: Release to PyPI

# Tag-triggered release. Push an annotated tag matching v* (e.g. v0.3.0) whose
# number equals `version` in pyproject.toml, and this builds the sdist + wheel
# and publishes them to PyPI via trusted publishing (OIDC) -- no API token is
# stored in the repo. Configure the publisher once on PyPI:
#   PyPI project "peakatail" -> Settings -> Publishing -> add a GitHub publisher
#   owner=BMGLab repo=PeakATail workflow=release.yml environment=pypi
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# A second tag push while the first is still publishing would race two uploads
# at the same PyPI version. Serialise, and never cancel a run mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The tag-is-on-main check below needs real history, not a shallow
          # clone of the tagged commit alone.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          echo "tag=$tag pyproject=$proj"
          if [ "$tag" != "$proj" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$proj'." >&2
            echo "::error::PyPI never lets a version number be reused, so publishing the wrong one is permanent. Fix the tag or the version and retry." >&2
            exit 1
          fi

      # Validate the notes HERE, in `build`, not in `github_release`. PyPI
      # never lets a version number be reused, so any check that can fail must
      # run before the upload: a CHANGELOG problem discovered after `publish`
      # leaves the version permanently burned with no Release and no DOI.
      # `ci.yml` triggers on pushes to develop/main and on PRs -- NOT on tags.
      # So without these two steps a tag pushed at ANY commit on ANY branch
      # publishes to PyPI permanently having run zero tests on that tree.
      - name: Verify the tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # A zero depth argument to `git fetch` is an error, not "no limit"
          # -- it fails with "depth 0 is not a positive number". checkout above
          # already requested full history, so a plain fetch of main is all
          # that is needed here.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of origin/main." >&2
            echo "::error::Releases are cut from main. Merge the release PR first, then tag the merge commit." >&2
            exit 1
          fi

      # Mirror ci.yml: several tests shell out to bedtools, and without it they
      # ERROR rather than skip -- so the suite cannot pass here even though the
      # identical code is green in CI.
      - name: Install bedtools (exercises the bedtools-guarded tests)
        if: startsWith(github.ref, 'refs/tags/')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bedtools

      - name: Run the test suite on the tagged tree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          pytest -q -rxX

      - name: Verify the release notes can be generated
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/changelog_section.py "$GITHUB_REF_NAME" > /dev/null

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Without this, a `workflow_dispatch` run on a branch uploads to PyPI while
    # `github_release` (which IS tag-guarded) is skipped -- burning the version
    # with no Release and no DOI, which is the exact failure this workflow was
    # changed to prevent.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Trusted publishing needs an OIDC token; the environment gate lets the
    # PyPI publisher scope trust to this workflow + environment.
    environment:
      name: pypi
      url: https://pypi.org/project/peakatail/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run or re-pushed tag would otherwise fail on the duplicate
          # upload, and `github_release` (needs: publish) would never run --
          # leaving the package on PyPI with no Release and therefore no DOI.
          # The tag check already pins the version to pyproject, so "already
          # there" is success, not a silent overwrite.
          skip-existing: true

  github_release:
    name: Create the GitHub Release
    needs: [build, publish]
    # Only a real tag can be released; workflow_dispatch has no version to
    # release and would create a Release named after a branch.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Zenodo archives the repository and mints a DOI when a GitHub *Release* is
    # published -- a bare tag does not trigger it. This job is therefore what
    # turns `git push origin v0.3.0` into a citable DOI, and it runs after
    # `publish` so a release that failed to reach PyPI never gets archived.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract the release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          python scripts/changelog_section.py "$GITHUB_REF_NAME" \
            --max-chars 120000 > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A pre-release tag (v0.3.0rc1, -beta...) must not be archived as a
          # citable version: Zenodo mints a DOI for every published Release.
          prerelease=""
          if ! printf '%s' "${GITHUB_REF_NAME#v}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            prerelease="--prerelease"
            echo "::notice::$GITHUB_REF_NAME looks like a pre-release; marking the Release accordingly."
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PeakATail $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            $prerelease \
            dist/*
