name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install bedtools (exercises the bedtools-guarded tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bedtools

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run test suite
        # Per-test timeout (300 s) comes from [tool.pytest.ini_options] via
        # pytest-timeout; timeout-minutes above bounds the whole job.
        run: pytest -q
