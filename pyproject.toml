[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ema"
version = "0.1a1"
description = "PeakATail - Peak-based APA analysis for single-cell RNA-seq"
authors = [
    {name = "Amir Amiri Tabat", email = "amiramiritabat01@gmail.com"}
]
requires-python = ">=3.9"
dependencies = [
    "pysam>=0.17.0",
    "anndata>=0.9.1",
    "scanpy>=1.9.3",
    "pandas>=1.3.5",
    "scipy>=1.8.0",
    "igraph>=0.10.6",
    "louvain>=0.8.0",
    "pybedtools>=0.9.0",
    "matplotlib>=3.5.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
benchmark = [
    "matplotlib-venn>=0.11",
]

[project.scripts]
ema = "ema.main:main"
ema_switch = "ema.switch_test.cli:cli"
ema_merge = "ema.merge_bam.cli:cli"

[tool.setuptools.packages.find]
include = ["ema*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
